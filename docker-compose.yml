services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sisprojetos-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sisprojetos-web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - api
