services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sisprojetos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/sisprojetos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sisprojetos-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: sisprojetos-web
    ports:
      - "3000:8080"
    depends_on:
      - api
    networks:
      - sisprojetos-net

  db:
    image: postgres:16-alpine
    container_name: sisprojetos-db
    environment:
      POSTGRES_DB: sisprojetos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sisprojetos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sisprojetos-net

volumes:
  postgres_data:

networks:
  sisprojetos-net:
    driver: bridge
